name: Publish

# Push a tag vX.Y.Z  -> check the tag against package.json and Chart.yaml,
#                       build and push the image, push the Helm chart to
#                       oci://ghcr.io/<owner>/charts, then create or update the
#                       GitHub release with the matching CHANGELOG section.
# Manual run         -> with "tag" set: only (re)write the release notes of an
#                       existing tag from the CHANGELOG on the selected branch.
#                       Without "tag": build and push an image of the branch
#                       (tagged sha-…, never latest).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (e.g. v0.2.0) to (re)write release notes for. Leave empty to build an image."
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  build_publish:
    if: github.event_name == 'push' || inputs.tag == ''
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Tag pushes only: refuse a tag that does not match package.json and the chart.
      - name: Set up Node.js
        if: github.event_name == 'push'
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Check release version
        if: github.event_name == 'push'
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          node scripts/check-release-version.mjs "$GITHUB_REF_NAME"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # v0.2.0 -> 0.2.0, 0.2, latest
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          no-cache: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    needs: build_publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Helm
        uses: azure/setup-helm@v5.1.0
        with:
          version: v3.22.1

      - name: Log in to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package and push chart
        run: |
          helm package charts/blokhouse
          helm push "blokhouse-${GITHUB_REF_NAME#v}.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"

  release:
    needs: [build_publish, chart]
    # Runs after the image and the chart on tag pushes, or alone on a manual run with a tag.
    if: >-
      always() &&
      ((github.event_name == 'push' && needs.build_publish.result == 'success' &&
        needs.chart.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && inputs.tag != ''))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract release notes from CHANGELOG
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No section '## [$version]' found in CHANGELOG.md"
            exit 1
          fi

      - name: Create or update GitHub release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Blokhouse $TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" --title "Blokhouse $TAG" --notes-file release-notes.md --verify-tag
          fi
