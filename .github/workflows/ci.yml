name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blokhouse
          POSTGRES_PASSWORD: blokhouse
          POSTGRES_DB: blokhouse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blokhouse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://blokhouse:blokhouse@localhost:5432/blokhouse

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      # `npm install` (not `npm ci`) so that Renovate PRs with an updated
      # package.json but stale lockfile don't fail at this step.
      - name: Install dependencies
        run: npm install

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Check schema and migrations are in sync
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Integration tests (PostgreSQL)
        run: npm run test:integration

      - name: Build Next.js app
        run: npm run build

  ansible-collection:
    # ansible-test's cgroup setup (`mount -o remount,rw /sys/fs/cgroup/`) fails on
    # the ubuntu-26.04 runner image 20261122.x; pinned until that image is fixed.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (meta/runtime.yml) and current
        ansible: ["2.17", "2.22"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install ansible-core ${{ matrix.ansible }}
        run: pipx install "ansible-core~=${{ matrix.ansible }}.0"

      # ansible-test needs the collection at ansible_collections/<namespace>/<name>
      - name: Place collection
        run: |
          mkdir -p "$RUNNER_TEMP/ac/ansible_collections/blokhouse"
          cp -r integrations/ansible "$RUNNER_TEMP/ac/ansible_collections/blokhouse/cmdb"
          cd "$RUNNER_TEMP/ac/ansible_collections/blokhouse/cmdb"
          git init -q && git add -A

      - name: Sanity tests
        working-directory: ${{ runner.temp }}/ac/ansible_collections/blokhouse/cmdb
        run: ansible-test sanity --docker default -v

      - name: Unit tests
        working-directory: ${{ runner.temp }}/ac/ansible_collections/blokhouse/cmdb
        run: ansible-test units --docker default -v

  helm:
    runs-on: ubuntu-latest
    needs: build
    env:
      # kind v0.33.0's default node image; kubeconform validates against the same version.
      KIND_NODE_IMAGE: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
      KUBERNETES_VERSION: "1.37.0"
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
      # Commit of github.com/datreeio/CRDs-catalog (Gateway API schemas for kubeconform).
      CRDS_CATALOG_REF: 04af58d740718c4dc719441bf39fb284c784f4a8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Helm
        uses: azure/setup-helm@v5.1.0
        with:
          version: v3.19.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      # `npm install` (not `npm ci`), as in the build job, for Renovate PRs.
      - name: Install dependencies
        run: npm install

      - name: Helm lint
        run: |
          helm lint charts/blokhouse
          for f in charts/blokhouse/ci/*-values.yaml; do
            echo "--- $f"
            helm lint charts/blokhouse -f "$f"
          done

      - name: Chart render tests
        run: npm run test:helm

      - name: Validate rendered manifests (kubeconform)
        run: |
          set -o pipefail
          curl -fsSL -o "$RUNNER_TEMP/kubeconform.tar.gz" \
            "https://github.com/yannh/kubeconform/releases/download/$KUBECONFORM_VERSION/kubeconform-linux-amd64.tar.gz"
          echo "$KUBECONFORM_SHA256  $RUNNER_TEMP/kubeconform.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/kubeconform.tar.gz" -C "$RUNNER_TEMP" kubeconform
          for f in charts/blokhouse/ci/*-values.yaml; do
            echo "--- $f"
            # HTTPRoute is validated with the Gateway API schema from the CRDs catalog.
            helm template bh charts/blokhouse -f "$f" | "$RUNNER_TEMP/kubeconform" -strict -summary \
              -ignore-missing-schemas -kubernetes-version "$KUBERNETES_VERSION" \
              -schema-location default \
              -schema-location "https://raw.githubusercontent.com/datreeio/CRDs-catalog/$CRDS_CATALOG_REF/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json"
          done

      - name: Build Docker image
        run: docker build -t ghcr.io/d4sw4r/blokhouse:ci .

      - name: Create kind cluster
        uses: helm/kind-action@v1.15.2
        with:
          version: v0.33.0
          node_image: ${{ env.KIND_NODE_IMAGE }}
          cluster_name: kind

      - name: Install and test the chart in kind
        run: |
          kind load docker-image ghcr.io/d4sw4r/blokhouse:ci
          sh scripts/helm/kind-test.sh ghcr.io/d4sw4r/blokhouse:ci

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t ghcr.io/d4sw4r/blokhouse:latest .

      - name: Start stack (docker compose with PostgreSQL)
        run: |
          cat > .env <<'ENV'
          NEXTAUTH_URL=http://localhost:3000
          NEXTAUTH_SECRET=ci-secret
          POSTGRES_PASSWORD=ci-password
          ADMIN_PASSWORD=ci-admin-password
          ENV
          docker compose up -d
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/health >/dev/null; then break; fi
            sleep 2
          done
          docker compose logs app

      - name: Smoke test
        run: ADMIN_PASSWORD=ci-admin-password sh scripts/smoke-test.sh

      - name: Ansible collection end-to-end test
        run: |
          pipx install "ansible-core~=2.22.0"
          ADMIN_PASSWORD=ci-admin-password sh integrations/ansible/tests/e2e/run.sh

      - name: Puppet module lint and end-to-end test
        run: |
          sudo gem install --no-document puppet -v '~> 8.10'
          sudo gem install --no-document puppet-lint
          (cd integrations/puppet && puppet parser validate manifests && puppet epp validate templates/*.epp && puppet-lint manifests)
          ADMIN_PASSWORD=ci-admin-password sh integrations/puppet/tests/e2e/run.sh

      - name: Setup Node.js (SSO end-to-end test)
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: SSO end-to-end test (Keycloak)
        run: |
          SSO="docker compose -f docker-compose.yml -f scripts/e2e/docker-compose.sso.yml"
          wait_app() {
            for i in $(seq 1 60); do
              if curl -fsS http://localhost:3000/api/health >/dev/null; then return 0; fi
              sleep 2
            done
            $SSO logs app; return 1
          }
          # Same issuer URL for the browser here and for the app container.
          echo "127.0.0.1 host.docker.internal" | sudo tee -a /etc/hosts
          $SSO up -d
          for i in $(seq 1 90); do
            if curl -fsS http://host.docker.internal:8080/realms/blokhouse/.well-known/openid-configuration >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://host.docker.internal:8080/realms/blokhouse/.well-known/openid-configuration >/dev/null || { $SSO logs keycloak; exit 1; }
          wait_app
          npm i --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
          node scripts/e2e/sso.spec.mjs

          # SSO only: no password form, and the credentials callback creates no session.
          echo "PASSWORD_LOGIN=false" >> .env
          $SSO up -d --force-recreate app
          wait_app
          node scripts/e2e/sso.spec.mjs --password-login-disabled
          json() { node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const v=JSON.parse(s||"{}");console.log(v?.[process.argv[1]] ?? "")})' "$1"; }
          JAR="$(mktemp)"
          CSRF=$(curl -s -c "$JAR" http://localhost:3000/api/auth/csrf | json csrfToken)
          [ -n "$CSRF" ] || { echo "FAIL: no CSRF token"; exit 1; }
          curl -s -b "$JAR" -c "$JAR" -o /dev/null -X POST http://localhost:3000/api/auth/callback/credentials \
            --data-urlencode "csrfToken=$CSRF" --data-urlencode "email=admin@example.com" --data-urlencode "password=ci-admin-password"
          SESSION=$(curl -s -b "$JAR" http://localhost:3000/api/auth/session)
          echo "session after password login attempt: $SESSION"
          [ -z "$(echo "$SESSION" | json user)" ] || { echo "FAIL: password login created a session with PASSWORD_LOGIN=false"; exit 1; }

          # Leave .env and the stack as the next step expects them (no Keycloak, no SSO-only mode).
          sed -i '/^PASSWORD_LOGIN=/d' .env
          $SSO down -v

      - name: Generated admin password goes to a 0600 file, not the logs
        run: |
          docker compose down -v
          sed -i '/ADMIN_PASSWORD/d' .env
          docker compose up -d
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/health >/dev/null; then break; fi
            sleep 2
          done
          docker compose logs app | grep -q "admin user created"
          docker compose exec -T app test -s /app/data/initial-admin-password
          docker compose exec -T app stat -c %a /app/data/initial-admin-password | grep -qx 600
          ! docker compose logs app | grep -qF "$(docker compose exec -T app cat /app/data/initial-admin-password)"

      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f scripts/e2e/docker-compose.sso.yml logs
