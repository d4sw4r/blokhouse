name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blokhouse
          POSTGRES_PASSWORD: blokhouse
          POSTGRES_DB: blokhouse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blokhouse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://blokhouse:blokhouse@localhost:5432/blokhouse

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      # `npm install` (not `npm ci`) so that Renovate PRs with an updated
      # package.json but stale lockfile don't fail at this step.
      - name: Install dependencies
        run: npm install

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Check schema and migrations are in sync
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Integration tests (PostgreSQL)
        run: npm run test:integration

      - name: Build Next.js app
        run: npm run build

  ansible-collection:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (meta/runtime.yml) and current
        ansible: ["2.17", "2.22"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install ansible-core ${{ matrix.ansible }}
        run: pipx install "ansible-core~=${{ matrix.ansible }}.0"

      # ansible-test needs the collection at ansible_collections/<namespace>/<name>
      - name: Place collection
        run: |
          mkdir -p "$RUNNER_TEMP/ac/ansible_collections/blokhouse"
          cp -r integrations/ansible "$RUNNER_TEMP/ac/ansible_collections/blokhouse/cmdb"
          cd "$RUNNER_TEMP/ac/ansible_collections/blokhouse/cmdb"
          git init -q && git add -A

      - name: Sanity tests
        working-directory: ${{ runner.temp }}/ac/ansible_collections/blokhouse/cmdb
        run: ansible-test sanity --docker default -v

      - name: Unit tests
        working-directory: ${{ runner.temp }}/ac/ansible_collections/blokhouse/cmdb
        run: ansible-test units --docker default -v

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t ghcr.io/d4sw4r/blokhouse:latest .

      - name: Start stack (docker compose with PostgreSQL)
        run: |
          cat > .env <<'ENV'
          NEXTAUTH_URL=http://localhost:3000
          NEXTAUTH_SECRET=ci-secret
          POSTGRES_PASSWORD=ci-password
          ADMIN_PASSWORD=ci-admin-password
          ENV
          docker compose up -d
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/health >/dev/null; then break; fi
            sleep 2
          done
          docker compose logs app

      - name: Smoke test
        run: ADMIN_PASSWORD=ci-admin-password sh scripts/smoke-test.sh

      - name: Ansible collection end-to-end test
        run: |
          pipx install "ansible-core~=2.22.0"
          ADMIN_PASSWORD=ci-admin-password sh integrations/ansible/tests/e2e/run.sh

      - name: Puppet module lint and end-to-end test
        run: |
          sudo gem install --no-document puppet -v '~> 8.10'
          sudo gem install --no-document puppet-lint
          (cd integrations/puppet && puppet parser validate manifests && puppet epp validate templates/*.epp && puppet-lint manifests)
          ADMIN_PASSWORD=ci-admin-password sh integrations/puppet/tests/e2e/run.sh

      - name: Generated admin password goes to a 0600 file, not the logs
        run: |
          docker compose down -v
          sed -i '/ADMIN_PASSWORD/d' .env
          docker compose up -d
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/health >/dev/null; then break; fi
            sleep 2
          done
          docker compose logs app | grep -q "admin user created"
          docker compose exec -T app test -s /app/data/initial-admin-password
          docker compose exec -T app stat -c %a /app/data/initial-admin-password | grep -qx 600
          ! docker compose logs app | grep -qF "$(docker compose exec -T app cat /app/data/initial-admin-password)"

      - name: Logs on failure
        if: failure()
        run: docker compose logs
