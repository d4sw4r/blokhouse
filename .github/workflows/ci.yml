name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      # `npm install` (not `npm ci`) so that Renovate PRs with an updated
      # package.json but stale lockfile don't fail at this step.
      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build Next.js app
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t blokhouse .

      - name: Smoke test container
        run: |
          docker run -d --name bh -p 3000:3000 \
            -e NEXTAUTH_SECRET=ci-secret -e NEXTAUTH_URL=http://localhost:3000 blokhouse
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health >/dev/null; then break; fi
            sleep 2
          done
          docker logs bh
          curl -fsS http://localhost:3000/api/health
          # Unauthenticated API access must be rejected
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/configuration-items)" = "401"
          docker logs bh | grep -q "admin user created"
          # The generated password goes to a 0600 file, never to the logs
          docker exec bh test -s /app/data/initial-admin-password
          docker exec bh stat -c %a /app/data/initial-admin-password | grep -qx 600
