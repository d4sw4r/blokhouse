# Copy .env.example to .env and set NEXTAUTH_SECRET before running:
#   echo "NEXTAUTH_SECRET=$(openssl rand -hex 32)" >> .env
services:
  app:
    image: ghcr.io/d4sw4r/blokhouse:latest
    # build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/blokhouse.db
    volumes:
      - blokhouse_data:/app/data

volumes:
  blokhouse_data:
