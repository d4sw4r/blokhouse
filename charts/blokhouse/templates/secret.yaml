{{- $name := include "blokhouse.fullname" . }}
{{- $data := dict }}
{{- if not .Values.blokhouse.existingSecret }}
{{- $_ := set $data "NEXTAUTH_SECRET" (include "blokhouse.secretValue" (dict "ctx" . "secret" $name "key" "NEXTAUTH_SECRET" "value" .Values.blokhouse.nextauthSecret "length" 48) | b64enc) }}
{{- $_ := set $data "ADMIN_PASSWORD" (include "blokhouse.secretValue" (dict "ctx" . "secret" $name "key" "ADMIN_PASSWORD" "value" .Values.blokhouse.admin.password "length" 24) | b64enc) }}
{{- with .Values.blokhouse.sso.clientSecret }}
{{- $_ := set $data "OIDC_CLIENT_SECRET" (b64enc .) }}
{{- end }}
{{- end }}
{{- if eq (include "blokhouse.databaseUrlSource" .) "chart" }}
{{- $_ := set $data "DATABASE_URL" (include "blokhouse.databaseUrl" . | b64enc) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "blokhouse.labels" . | nindent 4 }}
  annotations:
    # Generated values must survive uninstall/reinstall and upgrades.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- toYaml $data | nindent 2 }}
