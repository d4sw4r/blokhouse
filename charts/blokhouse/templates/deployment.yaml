{{- $fullname := include "blokhouse.fullname" . }}
{{- $appSecret := include "blokhouse.appSecretName" . }}
{{- $existingAppSecret := ne .Values.blokhouse.existingSecret "" }}
{{- $dbSource := include "blokhouse.databaseUrlSource" . }}
{{- $podSecurityContext := .Values.podSecurityContext }}
{{- $securityContext := .Values.securityContext }}
{{- if .Values.openshift }}
{{- $podSecurityContext = omit $podSecurityContext "runAsUser" "runAsGroup" "fsGroup" }}
{{- $securityContext = omit $securityContext "runAsUser" "runAsGroup" "fsGroup" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "blokhouse.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "blokhouse.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "blokhouse.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "blokhouse.serviceAccountName" . }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with $podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: blokhouse
          image: {{ include "blokhouse.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with $securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ $fullname }}
            {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            # The root filesystem is read-only; start.sh runs npx, which
            # needs a writable home and npm cache.
            - name: HOME
              value: /tmp
            - name: npm_config_cache
              value: /tmp/.npm
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $appSecret }}
                  key: NEXTAUTH_SECRET
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $appSecret }}
                  key: ADMIN_PASSWORD
                  {{- if $existingAppSecret }}
                  optional: true
                  {{- end }}
            {{- if or $existingAppSecret .Values.blokhouse.sso.clientSecret }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $appSecret }}
                  key: OIDC_CLIENT_SECRET
                  {{- if $existingAppSecret }}
                  optional: true
                  {{- end }}
            {{- end }}
            {{- if eq $dbSource "bundledSecret" }}
            # The password is only known at runtime: Kubernetes expands
            # $(BLOKHOUSE_DB_PASSWORD) from the variable declared before it.
            - name: BLOKHOUSE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.auth.existingSecret }}
                  key: password
            - name: DATABASE_URL
              value: {{ include "blokhouse.postgresql.url" (dict "ctx" . "password" "$(BLOKHOUSE_DB_PASSWORD)") | quote }}
            {{- else if eq $dbSource "externalSecret" }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalDatabase.existingSecret }}
                  key: {{ .Values.externalDatabase.existingSecretKey }}
            {{- else }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $fullname }}
                  key: DATABASE_URL
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            # Generous budget: the first start applies all migrations.
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            # TCP only: /api/health checks the database, and a database outage
            # must not restart every app pod.
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: next-cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: data
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
