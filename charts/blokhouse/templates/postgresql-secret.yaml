{{- if and .Values.postgresql.enabled (not .Values.postgresql.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "blokhouse.postgresql.fullname" . }}
  labels:
    {{- include "blokhouse.postgresql.labels" . | nindent 4 }}
  annotations:
    # The database keeps its password after uninstall; so must this Secret.
    helm.sh/resource-policy: keep
type: Opaque
data:
  password: {{ include "blokhouse.postgresql.password" . | b64enc | quote }}
{{- end }}
